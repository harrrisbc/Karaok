<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>KARAOK — Prep Studio</title>
  <link rel="stylesheet" href="/web/prep.css?v=19" />
</head>
<body class="prep-page">
  <main class="prep-desk">
    <div class="prep-top">
      <header class="desk-header">
        <div class="row header-row">
          <div>
            <p class="kicker">PREP STUDIO</p>
            <h1>Prep</h1>
          </div>
          <a class="overlay-link secondary-link" href="/live" target="_blank">Live</a>
        </div>
      </header>

      <section class="health" id="health">Checking tools…</section>

      <section class="import">
        <h2 class="desk-title">Import</h2>
        <p class="hint">Import（small Whisper）→ LRCLIB → Align · 一次一個 job</p>
        <div class="import-grid">
          <label>Lyrics language
            <select id="lang">
              <option value="cantonese" selected>Cantonese / 粵語</option>
              <option value="chinese">Chinese / 普通話中文</option>
              <option value="english">English</option>
            </select>
          </label>
          <label>Whisper model
            <select id="whisperModel">
              <option value="small" selected>small（穩）</option>
              <option value="medium">medium</option>
              <option value="large-v3">large-v3</option>
            </select>
          </label>
        </div>
        <label>Singer
          <input type="text" id="singer" placeholder="演唱者" maxlength="120" />
        </label>
        <div class="import-actions">
          <form id="fileForm">
            <label>Local audio
              <div class="file-pick">
                <input type="file" id="file" accept="audio/*,.mp3,.wav,.flac,.m4a" required />
                <label for="file" class="file-btn">Choose file</label>
                <span class="file-name" id="fileName">No file</span>
              </div>
            </label>
            <button type="submit">Import + analyze</button>
          </form>
          <form id="ytForm">
            <label>YouTube URL
              <input type="url" id="yt" placeholder="https://www.youtube.com/watch?v=…" required />
            </label>
            <button type="submit">Download + analyze</button>
          </form>
        </div>
      </section>

      <section class="job" id="job" hidden></section>
    </div>

    <section class="packs">
      <div class="row header-row packs-head">
        <h2 class="desk-title packs-title">Song packs</h2>
        <a class="overlay-link secondary-link" href="/show?preview=1" target="_blank">Overlay</a>
      </div>
      <ul id="songs"></ul>
    </section>
  </main>
  <script src="/web/prep.js?v=19"></script>
</body>
</html>
